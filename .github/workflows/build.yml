# Builds the app on GitHub's servers every time code is pushed,
# then publishes the APK on the repo's Releases page so you can
# download and install it straight from your phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PCKeyboard-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PC Keyboard build ${{ github.run_number }}
          body: Download the .apk below on your phone and tap it to install.
          files: PCKeyboard-${{ github.run_number }}.apk
